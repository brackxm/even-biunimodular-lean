name = "even-biunimodular-lean"
version = "0.0.1"
license = "Apache-2.0"
defaultTargets = ["Biunimodular"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Biunimodular"
# The certificate library mixes legacy files with module-system files.
allowNonModules = true
srcDir = "."
globs = ["Biunimodular", "Biunimodular.+"]
# Allow headroom for large exact certificates on x86_64 runners.
moreLeanArgs = ["-j1", "-M6144"]
