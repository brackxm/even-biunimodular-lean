name = "even-biunimodular-lean"
version = "0.0.1"
license = "Apache-2.0"
defaultTargets = ["Biunimodular"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "Biunimodular"
srcDir = "."
globs = ["Biunimodular", "Biunimodular.+"]
moreLeanArgs = ["-j1", "-M4096"]
