name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        shell: bash
        run: |
          df -h .
          # Remove preinstalled SDKs that the Lean build does not use.
          sudo rm -rf -- \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/share/swift
          df -h .
          # The local build and toolchain occupy about 21 GiB; allow headroom.
          available_kib=$(df -Pk . | awk 'NR == 2 {print $4}')
          required_kib=$((30 * 1024 * 1024))
          if (( available_kib < required_kib )); then
            echo "::error::Lean build needs at least 30 GiB free after cleanup; found $((available_kib / 1024 / 1024)) GiB."
            exit 1
          fi
      - name: Build Lean project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "true"
          build-args: "--wfail"
          use-mathlib-cache: "true"
          use-github-cache: "true"
